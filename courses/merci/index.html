<title>Merci · Les courses solidaires</title>

<style>
@font-face{font-family:"Charis SIL";font-weight:700;font-display:swap;src:url(../polices/charis-700.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(../polices/atkinson-400.woff2) format("woff2")}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff9f0;color:#25223b;font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.6}

h1{font-family:"Charis SIL",Charter,Georgia,serif;font-size:clamp(32px,6vw,48px);line-height:1.1;margin:0 0 16px;text-wrap:balance}
p{margin:0 0 16px;color:#5e5871}
a{display:inline-block;margin-top:10px;font-weight:700;background:#6541c1;color:#fff;text-decoration:none;border-radius:999px;padding:13px 26px}
a:hover{background:#4f2fa3}
a:focus-visible{outline:3px solid #6541c1;outline-offset:3px}
</style>
</head>

<main>
<div class="rond" aria-hidden="true">✓</div>

<p>Nous vous écrivons quand l'essai se prépare près de chez vous. Rien ne vous engage.</p>
